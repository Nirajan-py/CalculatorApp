<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="Favicon.png" type="image/x-icon">
  </head>
  <body>
    <div class="calculator">
      <input type="text" class="calculator-screen" name="display" value="" disabled />

      <div class="calculator-keys">
        <button id="operator" id="btn">AC</button>
        <button id="operator">DE</button>
        <button id="operator">.</button>
        <button id="operator">/</button>
        <button class="key-7">7</button>
        <button class="key-8">8</button>
        <button class="key-9">9</button>
        <button id="operator">*</button>
        <button class="key-4">4</button>
        <button class="key-5">5</button>
        <button class="key-6">6</button>
        <button id="operator">-</button>
        <button class="key-1">1</button>
        <button class="key-2">2</button>
        <button class="key-3">3</button>
        <button id="operator">+</button>
        <button class="key-0">00</button>
        <button class="key-0">0</button>
        <button class="equal-sign" id="operator">=</button>
      </div>
    </div>

    <!-- link JavaScript File -->
     <script src="script.js"></script>
  </body>
</html>
